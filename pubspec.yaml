name: finance_tracker
description: A high-performance personal finance tracking application with AI decision logic.
publish_to: 'none' # Prevents accidental publishing to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  # Used to update the UI instantly when you add a transaction
  provider: ^6.1.1

  # Local Database (SQL)
  # Stores your financial records permanently on the device
  sqflite: ^2.3.2

  # Path Helper
  # Required by sqflite to find the correct folder on Android/iOS
  path: ^1.9.0

  # Path Provider
  # Gets application documents directory for database storage
  path_provider: ^2.1.2

  # CSV Library
  # For parsing and generating CSV files
  csv: ^5.1.0

  # File Picker
  # For selecting files to import
  file_picker: ^8.0.0

  # Charts & Graphs
  # Renders the beautiful Pie Chart in your 'Analysis' dashboard
  fl_chart: ^0.66.0

  # Typography
  # Downloads professional fonts (Inter) automatically
  google_fonts: ^6.1.0

  # Date Formatting
  # Formats dates like "Jan 23, 10:30 AM"
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lints
  # Helps you write clean Dart code by warning about bad practices
  flutter_lints: ^3.0.0

flutter:
  # Ensures Material 3 icons and fonts work
  uses-material-design: true

  # If you decide to add custom icons later, uncomment these lines:
  # assets:
  #   - assets/icons/
  #   - assets/images/
